services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: civicme
      POSTGRES_USER: civicme
      POSTGRES_PASSWORD: civicme
    ports:
      - "5432:5432"
    volumes:
      - civicme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicme -d civicme"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://civicme:civicme@db:5432/civicme
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  civicme_pgdata:
